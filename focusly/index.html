<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Focusly organiza tus tareas, prioridades y hábitos en un único lugar para que te concentres en lo que importa."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Focusly — Organiza tus tareas y recupera tu foco</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('focusly:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0c10' : '#fafafa');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Focusly necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
