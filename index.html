<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241b33" />
    <title>INKRUSH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4C40 18 54 28 54 42a22 22 0 0 1-44 0C10 28 24 18 32 4z' fill='%23FF6A13' stroke='%23241b33' stroke-width='4'/%3E%3Ccircle cx='24' cy='40' r='5' fill='%23FFB347'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #241b33;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #3b2d57 0%, #241b33 55%, #1a1326 100%);
        z-index: 100;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #boot.hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-splats" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1 class="boot-logo" aria-label="INKRUSH">
          <span class="o">INK</span><span class="b">RUSH</span>
        </h1>
        <div class="boot-drop">
          <svg viewBox="0 0 120 160" width="120" height="160" aria-hidden="true">
            <defs>
              <clipPath id="dropClip">
                <path d="M60 6 C74 34 108 62 108 100 A48 48 0 0 1 12 100 C12 62 46 34 60 6 Z" />
              </clipPath>
              <linearGradient id="dropFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFB347" />
                <stop offset="0.5" stop-color="#FF6A13" />
                <stop offset="1" stop-color="#1E6BFF" />
              </linearGradient>
            </defs>
            <g clip-path="url(#dropClip)">
              <rect x="0" y="0" width="120" height="160" fill="#2e2342" />
              <g id="dropLevel" transform="translate(0,160)">
                <path class="boot-wave" d="M-120 8 Q-105 0 -90 8 T-60 8 T-30 8 T0 8 T30 8 T60 8 T90 8 T120 8 T150 8 T180 8 T210 8 T240 8 V200 H-120 Z" fill="url(#dropFill)" />
              </g>
              <ellipse cx="40" cy="92" rx="8" ry="16" fill="rgba(255,255,255,0.35)" transform="rotate(-25 40 92)" />
            </g>
            <path d="M60 6 C74 34 108 62 108 100 A48 48 0 0 1 12 100 C12 62 46 34 60 6 Z" fill="none" stroke="#fff3e0" stroke-width="6" stroke-linejoin="round" />
          </svg>
          <div class="boot-pct" id="bootPct">0%</div>
        </div>
        <p class="boot-status" id="bootStatus">Agitando los botes de pintura…</p>
        <p class="boot-tip" id="bootTip">Mantén SHIFT sobre tu pintura para surfear a toda velocidad.</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
